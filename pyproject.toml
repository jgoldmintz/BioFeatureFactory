[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "biofeaturefactory"
version = "0.1.0"
description = "BioFeatureFactory — feature extraction for disease-associated mutations"
requires-python = ">=3.9"
dependencies = [
    "biopython>=1.79",
    "pandas>=1.3.0",
    "numpy>=1.20.0,<2",
    "requests>=2.25.0",
    "pysam>=0.19.0",
    "scipy>=1.7.0",
]

[project.scripts]
bff-rnafold      = "biofeaturefactory.RNAfold.run_viennaRNA_pipeline:main"
bff-genesplicer  = "biofeaturefactory.genesplicer.genesplicer_ensemble:main"
bff-netphos      = "biofeaturefactory.netphos.netphos_pipeline:main"
bff-netmhc       = "biofeaturefactory.netMHC.netmhc_pipeline:main"
bff-netnglyc     = "biofeaturefactory.netNglyc.netnglyc_pipeline:main"
bff-netsurfp3    = "biofeaturefactory.NetSurfP3.netsurfp3_pipeline:main"
bff-miranda      = "biofeaturefactory.miranda.miranda_ensemble:main"
bff-codon-usage  = "biofeaturefactory.codon_usage.codon_usage_pipeline:main"
bff-rare-codon   = "biofeaturefactory.rare_codon.rare_codon_pipeline:main"
bff-evmutation   = "biofeaturefactory.mutation_effects.evmutation_pipeline:main"
bff-adabmdca     = "biofeaturefactory.mutation_effects.adabmdca_pipeline:main"
bff-alphafold3   = "biofeaturefactory.alphafold3.alphafold3_pipeline:main"
bff-spliceai     = "biofeaturefactory.spliceai.annot_to_spliceai:main"

[tool.setuptools.packages.find]
include = ["biofeaturefactory*"]

[project.optional-dependencies]
rnafold = ["ViennaRNA"]
evmutation = ["numba>=0.53"]
rare-codon = ["networkx>=2.6", "prody>=2.0"]
# adabmDCA itself is installed EDITABLE from the spqb/adabmDCApy clone by
# bootstrap step 8b — NOT from PyPI (the PyPI 'adabmDCA' is a different package).
# This extra provides only the torch runtime dep that adabmdca_pipeline.py
# imports directly; adabmDCA pulls in matplotlib, pandas>=2.2, tqdm, wandb,
# biopython, seaborn transitively (see adabmDCApy setup.py). Requires Python >= 3.10.
adabmdca = ["torch>=2.0.0"]
# NetSurfP3 wrapper deps. torch is a DIRECT import in netsurfp3_pipeline.py; the
# other five are nsp3's own runtime deps (also pulled by `pip install -e nsp3/nsp3`),
# listed here so `pip install .[all]` / `.[netsurfp3]` is self-sufficient.
netsurfp3 = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "optuna>=4.8.0",
    "matplotlib>=3.10.8",
    "fair-esm>=2.0.0",
    "h5py>=3.16.0",
    "click>=8.3.1",
]
all = [
    "ViennaRNA",
    "numba>=0.53",
    "networkx>=2.6",
    "prody>=2.0",
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "optuna>=4.8.0",
    "matplotlib>=3.10.8",
    "fair-esm>=2.0.0",
    "h5py>=3.16.0",
    "click>=8.3.1",
]
dev = ["pytest>=7.0", "pytest-cov>=4.0"]

[tool.pytest.ini_options]
testpaths = ["test"]
addopts = "-v"
